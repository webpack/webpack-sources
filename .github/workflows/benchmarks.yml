name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Only pull request runs share a group; every other run gets a group of its own
# (`github.run_id`), because a group holds at most one pending run and a later
# push would otherwise evict the one waiting. CodSpeed compares a pull request
# against the benchmark result of its base commit, so a `main` commit that never
# gets measured leaves later comparisons without a baseline.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The runner image and Node.js version are pinned: CodSpeed compares a pull
# request against its base commit's run, and a different OS image or Node.js
# version between the two (`ubuntu-latest` and `lts/*` move on their own)
# changes the numbers of every benchmark at once. Update them in a pull request
# of their own, so the shift is attributed to it.
env:
  NODE_VERSION: 24.21.0

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # Required for OIDC authentication with CodSpeed
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Run benchmarks
        uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        with:
          run: npm run benchmark
          mode: "simulation"

  memory-benchmark:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # Required for OIDC authentication with CodSpeed
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Run memory benchmarks
        uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        with:
          run: npm run benchmark:memory
          mode: "memory"
