name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Only pull request runs share a group; every other run gets a group of its own
# (`github.run_id`), because a group holds at most one pending run and a later
# push would otherwise evict the one waiting. CodSpeed compares a pull request
# against the benchmark result of its base commit, so a `main` commit that never
# gets measured leaves later comparisons without a baseline.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The runner image is pinned: CodSpeed compares a pull request against its
# base commit's run, and `ubuntu-latest` moving to a new image between the two
# changes the numbers of every benchmark at once. Update it in a pull request of
# its own, so the shift is attributed to it.

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # Required for OIDC authentication with CodSpeed
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - name: Run benchmarks
        uses: CodSpeedHQ/action@78102a468f96d8e0ccb92d0ec49425753fc42062 # v5.6.0
        with:
          run: npm run benchmark
          mode: "simulation"

  memory-benchmark:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # Required for OIDC authentication with CodSpeed
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - name: Run memory benchmarks
        uses: CodSpeedHQ/action@78102a468f96d8e0ccb92d0ec49425753fc42062 # v5.6.0
        with:
          run: npm run benchmark:memory
          mode: "memory"
